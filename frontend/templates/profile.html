{{define "main"}}<h1 class="text-3xl font-bold mb-6">Account</h1><section class="panel max-w-2xl"><dl class="space-y-3"><div><dt class="muted text-sm">Name</dt><dd>{{.User.Name}}</dd></div><div><dt class="muted text-sm">Login email</dt><dd>{{.User.Email}}</dd></div><div><dt class="muted text-sm">Last login</dt><dd>{{if .User.LastLoginAt}}{{.User.LastLoginAt.Format "02 Jan 2006, 15:04 MST"}}{{else}}Not recorded{{end}}</dd></div></dl><form method="post" action="/profile/notification-email" class="border-t border-[#2a2a2a] mt-6 pt-6 space-y-4"><label class="label" for="notification-email">Email for alert notifications</label><input class="field" id="notification-email" name="notification_email" type="email" maxlength="254" value="{{.User.NotificationEmail}}" placeholder="Leave blank to stop email notifications"><button class="button">Save email</button></form><p class="muted text-sm mt-6">Accounts are managed by your operator. There is no public signup.</p></section>{{end}}
