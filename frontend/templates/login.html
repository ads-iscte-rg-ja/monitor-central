{{define "main"}}<section class="panel max-w-md mx-auto"><h1 class="text-3xl font-bold mb-2">Sign in</h1><p class="muted mb-6">Use your administrator account.</p>{{if .Error}}<p class="error-notice mb-5" role="alert">{{.Error}}</p>{{end}}<form method="post" action="/login" class="space-y-5"><div><label class="label" for="email">Email</label><input class="field" type="email" id="email" name="email" autocomplete="username" maxlength="254" value="{{if .Form}}{{.Form.Email}}{{end}}" required></div><div><label class="label" for="password">Password</label><input class="field" type="password" id="password" name="password" autocomplete="current-password" required></div><button class="button w-full" type="submit">Sign in</button></form></section>{{end}}
