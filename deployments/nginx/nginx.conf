# Load balancer in front of the central instances (ADR-0007).
# Scale with: docker compose up -d --scale backend=3
worker_processes auto;
events { worker_connections 4096; }

http {
  # Docker's DNS: re-resolve "backend" so replicas added by --scale are found.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Passive health checks: an instance that fails is left out for a while.
  upstream central_http {
    zone central_http 64k;
    server backend:3333 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }
  upstream central_grpc {
    zone central_grpc 64k;
    server backend:3334 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  access_log off;

  # Web UI. Sessions live in PostgreSQL, so no sticky sessions are needed.
  server {
    listen 3333;
    client_max_body_size 1m;
    location / {
      proxy_pass http://central_http;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite, never append: the central believes only this proxy's value.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # gRPC ingestion. nginx ends each agent's HTTP/2 connection and spreads every
  # request, not every connection, across the instances.
  server {
    listen 3334;
    http2 on;
    # Messages are bounded at 1 MiB by the contract (monitor-api); allow framing.
    client_max_body_size 2m;
    location / {
      grpc_pass grpc://central_grpc;
      grpc_set_header X-Forwarded-For $remote_addr;
      grpc_read_timeout 60s;
      # Only a request not yet sent to an instance is retried on another one (nginx
      # does not resend POSTs); the agent retries the rest, and ingestion is
      # idempotent (telemetry receipts).
      grpc_next_upstream error timeout http_502 http_503;
    }
  }
}
