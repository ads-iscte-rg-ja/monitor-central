# Prometheus do perfil Compose "observability" (ADR-0004): só para testes de carga e demonstrações.
global:
  scrape_interval: 5s      # resolução suficiente para os testes de carga de poucos minutos
  evaluation_interval: 5s

scrape_configs:
  - job_name: monitor-central
    # One target per replica (docker compose --scale backend=N, ADR-0007).
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 9464
        refresh_interval: 5s
