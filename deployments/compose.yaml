# One build context and the same configuration for the backend and DB tools.
# Override the host-side DB address/port for Docker's private service network.
x-central: &central
  build:
    context: ..
    dockerfile: Dockerfile
  env_file:
    - ${CENTRAL_ENV_FILE:-../.env}
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    PORT: "3333"
    GRPC_PORT: "3334"
    # Inside the container the metrics listener must accept the Compose network
    # (Prometheus); on the host it is published on loopback only.
    METRICS_ADDR: ":9464"
    FRONTEND_PATH: /app/frontend

services:
  postgres:
    image: postgres:16
    container_name: admin-tool-postgres
    # Do not give the database the application's HMAC, SMTP, or admin secrets.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # Data persistence
      - postgres_data:/var/lib/postgresql/data
      # Initialization: Runs on first startup only
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    restart: unless-stopped
    healthcheck:
      # The entrypoint's temporary initialization server is socket-only. Check
      # TCP so dependencies wait until init.sql has finished and startup is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *central
    command: ["/app/bin/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *central
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORT:-3333}:3333"
      - "127.0.0.1:${GRPC_PORT:-3334}:3334"
      - "127.0.0.1:${METRICS_PORT:-9464}:9464"
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3333/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Profile "observability" (ADR-0004): metrics dashboards for load tests and
  # demos only. Start with: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    depends_on: [backend]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    profiles: [observability]
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
